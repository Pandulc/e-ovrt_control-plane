pattern_set:
  id: cr01_cr02_v2_probe
  description: >-
    PROBE de validacion de G0 sobre video real. NO es el pattern set v2 oficial
    (spec 41 §7): usa las bandas temporales declaradas ahi (confirm 4s / 7s,
    resolve 2s / 3s) pero sin la calibracion del tramo de evaluacion.
    granularity: scene (ADR-002). Sin cooldown (ADR-011). Sin memoria de
    cobertura (ADR-012: inaplicable bajo escena).
  patterns:
    - id: CR-01
      name: person_without_helmet
      description: "Persona observada sin evidencia asociada de casco."
      enabled: true
      condition_id: CR-01
      severity: high
      subject_class: person
      granularity: scene
      required_absent_class: helmet
      region:
        type: upper_body
        y_min_ratio: 0.0
        y_max_ratio: 0.45
        x_margin_ratio: 0.12
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_ms: 4000.0
        resolve_after_ms: 2000.0
        confirm_after_frames: 1
        resolve_after_frames: 1

    - id: CR-02
      name: person_without_vest
      description: "Persona observada sin evidencia asociada de chaleco reflectante."
      enabled: true
      condition_id: CR-02
      severity: medium
      subject_class: person
      granularity: scene
      required_absent_class: vest
      region:
        type: torso
        y_min_ratio: 0.25
        y_max_ratio: 0.85
        x_margin_ratio: 0.08
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_ms: 7000.0
        resolve_after_ms: 3000.0
        confirm_after_frames: 1
        resolve_after_frames: 1
