pattern_set:
  id: cr01_cr02_v2_sens_c
  description: >
    ANALISIS DE SENSIBILIDAD, NO ES UN PATTERN SET OFICIAL (el oficial sigue siendo
    `cr01_cr02_v2`). Variante combinada «C» de la matriz de la jornada en vivo del
    2026-11-07: exige mas confianza para dar por presente el EPP. Respecto de `cr01_cr02_v2`
    cambian solo tres valores: CR-01 region de la cabeza y_max_ratio 0.45 -> 0.35 y casco
    min_absent_class_confidence 0.25 -> 0.50; CR-02 chaleco min_absent_class_confidence
    0.25 -> 0.40. Mismos timings, misma granularidad (scene). Se mide en las pruebas ALR-13 y
    ALR-14 (pre-registro en e-ovrt_experimental-setup), fuera de las tomas con las que se ajusto.
  patterns:
    - id: CR-01
      name: person_without_helmet
      description: "Persona observada sin evidencia asociada de casco."
      enabled: true
      condition_id: CR-01
      severity: high
      subject_class: person
      required_absent_class: helmet
      granularity: scene
      region:
        type: upper_body
        y_min_ratio: 0.0
        y_max_ratio: 0.35
        x_margin_ratio: 0.12
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.50
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 1
        resolve_after_frames: 1
        confirm_after_ms: 4000.0
        resolve_after_ms: 2000.0

    - id: CR-02
      name: person_without_vest
      description: "Persona observada sin evidencia asociada de chaleco reflectante."
      enabled: true
      condition_id: CR-02
      severity: medium
      subject_class: person
      required_absent_class: vest
      granularity: scene
      region:
        type: torso
        y_min_ratio: 0.25
        y_max_ratio: 0.85
        x_margin_ratio: 0.08
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.40
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 1
        resolve_after_frames: 1
        confirm_after_ms: 7000.0
        resolve_after_ms: 3000.0
