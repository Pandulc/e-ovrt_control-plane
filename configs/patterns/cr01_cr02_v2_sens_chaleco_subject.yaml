pattern_set:
  id: cr01_cr02_v2_sens_chaleco_subject
  description: >
    ANALISIS DE SENSIBILIDAD, NO ES UN PATTERN SET OFICIAL. `cr01_cr02_v2_sens_chaleco` con
    `granularity: subject`: respecto de `cr01_cr02_v2_subject` cambia solo CR-02
    min_absent_class_confidence 0.25 -> 0.40. Requiere `track_id` en las personas
    (input.track_persons). Se mide en ALR-13 y ALR-14.
  patterns:
    - id: CR-01
      name: person_without_helmet
      description: "Persona observada sin evidencia asociada de casco (por sujeto)."
      enabled: true
      condition_id: CR-01
      severity: high
      subject_class: person
      required_absent_class: helmet
      granularity: subject
      region:
        type: upper_body
        y_min_ratio: 0.0
        y_max_ratio: 0.45
        x_margin_ratio: 0.12
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 1
        resolve_after_frames: 1
        confirm_after_ms: 4000.0
        resolve_after_ms: 2000.0

    - id: CR-02
      name: person_without_vest
      description: "Persona observada sin evidencia asociada de chaleco (por sujeto)."
      enabled: true
      condition_id: CR-02
      severity: medium
      subject_class: person
      required_absent_class: vest
      granularity: subject
      region:
        type: torso
        y_min_ratio: 0.25
        y_max_ratio: 0.85
        x_margin_ratio: 0.08
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.40
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 1
        resolve_after_frames: 1
        confirm_after_ms: 7000.0
        resolve_after_ms: 3000.0
