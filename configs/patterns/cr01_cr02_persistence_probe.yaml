pattern_set:
  id: cr01_cr02_persistence_probe
  description: >-
    DIAGNOSTICO, no experimental. Copia exacta de cr01_cr02_v1 salvo
    confirm_after_frames: 2. Unico proposito: sobre un corpus de imagenes
    independientes, este umbral vuelve la alerta INALCANZABLE (cada imagen es su
    propia clave de estado), y sirve para verificar que el motor lo declare como
    causa `persistence_unreachable_on_non_temporal_source` (ADR-013) en vez de
    reportar cero alertas en silencio.
    No usar para comparar motores ni para calibrar umbrales.
  patterns:
    - id: CR-01
      name: person_without_helmet
      description: "Persona observada sin evidencia asociada de casco."
      enabled: true
      condition_id: CR-01
      severity: medium
      subject_class: person
      required_absent_class: helmet
      region:
        type: upper_body
        y_min_ratio: 0.0
        y_max_ratio: 0.45
        x_margin_ratio: 0.12
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 2
        resolve_after_frames: 1

    - id: CR-02
      name: person_without_vest
      description: "Persona observada sin evidencia asociada de chaleco reflectante."
      enabled: true
      condition_id: CR-02
      severity: medium
      subject_class: person
      required_absent_class: vest
      region:
        type: torso
        y_min_ratio: 0.25
        y_max_ratio: 0.85
        x_margin_ratio: 0.08
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 2
        resolve_after_frames: 1
