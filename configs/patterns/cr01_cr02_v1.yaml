# =============================================================================
# DEPRECADO — solo para smoke tests y tests unitarios de mecánica por frames
# (timing por `confirm_after_frames`, sin `granularity: scene`).
# NUNCA usar para evaluación cuantitativa ni corridas de resultados: produce
# falsos `missed` contra GT derivado con umbrales en ms — `derive_clip_gt`
# asume CR-01 4000ms / CR-02 7000ms y este set nunca confirma con esa
# semántica (hallazgo F-DR9, dry-run 2026-07-22).
# El pattern set VIGENTE es `cr01_cr02_v2.yaml` (CR-01 high 4000ms,
# CR-02 medium 7000ms, granularity scene).
# =============================================================================
pattern_set:
  id: cr01_cr02_v1
  description: "DEPRECADO (F-DR9): set inicial DBE, timing por frames. Solo smoke/tests; usar cr01_cr02_v2 para resultados."
  patterns:
    - id: CR-01
      name: person_without_helmet
      description: "Persona observada sin evidencia asociada de casco."
      enabled: true
      condition_id: CR-01
      severity: medium
      subject_class: person
      required_absent_class: helmet
      region:
        type: upper_body
        y_min_ratio: 0.0
        y_max_ratio: 0.45
        x_margin_ratio: 0.12
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 1
        resolve_after_frames: 1

    - id: CR-02
      name: person_without_vest
      description: "Persona observada sin evidencia asociada de chaleco reflectante."
      enabled: true
      condition_id: CR-02
      severity: medium
      subject_class: person
      required_absent_class: vest
      region:
        type: torso
        y_min_ratio: 0.25
        y_max_ratio: 0.85
        x_margin_ratio: 0.08
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.25
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 1
        resolve_after_frames: 1

