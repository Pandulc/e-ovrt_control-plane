pattern_set:
  id: cr01_cr02_field_v1
  description: >
    Perfil de campo para video real: persistencia temporal + expiracion de sujetos
    + cooldown de re-alerta + region adaptativa por pose + memoria de cobertura EPP
    (amortigua parpadeo del detector y oclusiones breves). La memoria retrasa la
    alerta hasta coverage_memory_ms despues de la ultima cobertura real, por eso
    NO se usa en el fixture sintetico (cr01_cr02_temporal_eval).
  patterns:
    - id: CR-01
      name: person_without_helmet
      description: "Persona observada sin evidencia asociada de casco durante ventana persistente."
      enabled: true
      condition_id: CR-01
      severity: medium
      subject_class: person
      required_absent_class: helmet
      region:
        type: upper_body
        y_min_ratio: 0.0
        y_max_ratio: 0.45
        x_margin_ratio: 0.12
        full_height_aspect_ratio: 0.75
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.30
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 3
        resolve_after_frames: 2
        confirm_after_ms: 1000.0
        resolve_after_ms: 500.0
        subject_absent_timeout_frames: 75
        subject_absent_timeout_ms: 3000.0
        realert_cooldown_frames: 125
        realert_cooldown_ms: 5000.0
        coverage_memory_frames: 38
        coverage_memory_ms: 1500.0

    - id: CR-02
      name: person_without_vest
      description: "Persona observada sin evidencia asociada de chaleco durante ventana persistente."
      enabled: true
      condition_id: CR-02
      severity: medium
      subject_class: person
      required_absent_class: vest
      region:
        type: torso
        y_min_ratio: 0.25
        y_max_ratio: 0.85
        x_margin_ratio: 0.08
        full_height_aspect_ratio: 0.75
      evidence:
        min_subject_confidence: 0.35
        min_absent_class_confidence: 0.30
        min_subject_area_px: 400.0
      timing:
        confirm_after_frames: 3
        resolve_after_frames: 2
        confirm_after_ms: 1000.0
        resolve_after_ms: 500.0
        subject_absent_timeout_frames: 75
        subject_absent_timeout_ms: 3000.0
        realert_cooldown_frames: 125
        realert_cooldown_ms: 5000.0
        coverage_memory_frames: 38
        coverage_memory_ms: 1500.0
