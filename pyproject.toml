[project]
name = "eovrt-control-plane"
version = "0.1.0"
description = "Experimental control plane for E-OVRT-VDP"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "pyzmq",
    "msgpack",
    "fastapi>=0.110",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]
labs = [
    "torch",
    "torchvision",
    "transformers",
    "accelerate",
    "huggingface_hub",
    "pillow",
    "opencv-python-headless",
    "ultralytics",
]

[project.scripts]
eovrt-control = "eovrt_control.cli:app"
eovrt-labs = "eovrt_labs.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# tests/labs requiere el extra pesado [labs] (numpy/torch/cv2) y se corre explicito:
#   pytest tests/labs
addopts = "--ignore=tests/labs"
markers = [
    "integration: usa ZeroMQ sobre localhost (spec 40 SS3.4, test de paridad)",
]

